name: social

# The Open Practice accounts post from here, not from a laptop.
#   schedule - daily verify: is every credential still live? Posts nothing.
#   dispatch - publish one piece of copy to the armed rails (or the ones named).
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      text:
        description: "What to post. Empty = verify only."
        required: false
        default: ""
      link:
        description: "URL to append (defaults to the site)"
        required: false
        default: ""
      rails:
        description: "Comma list: bsky,mastodon,nostr,discord,pinterest,tumblr. Empty = all armed."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q coincurve websocket-client
      - name: unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_social.py"
      - name: verify every credential
        env:
          OP_BSKY_ID: ${{ secrets.OP_BSKY_ID }}
          OP_BSKY_PASS: ${{ secrets.OP_BSKY_PASS }}
          OP_MASTODON_INSTANCE: ${{ secrets.OP_MASTODON_INSTANCE }}
          OP_MASTODON_TOKEN: ${{ secrets.OP_MASTODON_TOKEN }}
          OP_NOSTR_NSEC: ${{ secrets.OP_NOSTR_NSEC }}
          OP_CARD_URL: ${{ secrets.OP_CARD_URL }}
          OP_DISCORD_WEBHOOK: ${{ secrets.OP_DISCORD_WEBHOOK }}
          OP_BUFFER_TOKEN: ${{ secrets.OP_BUFFER_TOKEN }}
          OP_PINTEREST_BOARD: ${{ secrets.OP_PINTEREST_BOARD }}
          OP_TUMBLR_CK: ${{ secrets.OP_TUMBLR_CK }}
          OP_TUMBLR_CS: ${{ secrets.OP_TUMBLR_CS }}
          OP_TUMBLR_TOKEN: ${{ secrets.OP_TUMBLR_TOKEN }}
          OP_TUMBLR_TOKEN_SECRET: ${{ secrets.OP_TUMBLR_TOKEN_SECRET }}
          OP_TUMBLR_BLOG: ${{ secrets.OP_TUMBLR_BLOG }}
        run: python3 tools/social.py verify
      - name: post
        if: github.event_name == 'workflow_dispatch' && inputs.text != ''
        env:
          OP_BSKY_ID: ${{ secrets.OP_BSKY_ID }}
          OP_BSKY_PASS: ${{ secrets.OP_BSKY_PASS }}
          OP_MASTODON_INSTANCE: ${{ secrets.OP_MASTODON_INSTANCE }}
          OP_MASTODON_TOKEN: ${{ secrets.OP_MASTODON_TOKEN }}
          OP_NOSTR_NSEC: ${{ secrets.OP_NOSTR_NSEC }}
          OP_DISCORD_WEBHOOK: ${{ secrets.OP_DISCORD_WEBHOOK }}
          OP_BUFFER_TOKEN: ${{ secrets.OP_BUFFER_TOKEN }}
          OP_PINTEREST_BOARD: ${{ secrets.OP_PINTEREST_BOARD }}
          OP_TUMBLR_CK: ${{ secrets.OP_TUMBLR_CK }}
          OP_TUMBLR_CS: ${{ secrets.OP_TUMBLR_CS }}
          OP_TUMBLR_TOKEN: ${{ secrets.OP_TUMBLR_TOKEN }}
          OP_TUMBLR_TOKEN_SECRET: ${{ secrets.OP_TUMBLR_TOKEN_SECRET }}
          OP_TUMBLR_BLOG: ${{ secrets.OP_TUMBLR_BLOG }}
        run: |
          set -e
          args=(--text "${{ inputs.text }}")
          [ -n "${{ inputs.link }}" ] && args+=(--link "${{ inputs.link }}")
          [ -n "${{ inputs.rails }}" ] && args+=(--rails "${{ inputs.rails }}")
          python3 tools/social.py post "${args[@]}"
